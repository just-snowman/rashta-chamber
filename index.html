<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>라스타의 장미방 & 슐라이스하임 궁전 정원</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --rose-cream: #fff7f8;
      --rose-blush: #f2bcc6;
      --rose-deep: #9c3d54;
      --sage-mint: #a8c7bb;
      --gold-leaf: #e3be7b;
      --letter-paper: #fffaf5;
      --letter-border: #e5c3c9;
      --letter-ink: #3a212a;
      --glass-bg: rgba(46, 22, 32, 0.72);
      --glass-border: rgba(248, 212, 218, 0.36);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #24131b;
      font-family: 'Noto Serif KR', Georgia, serif;
      color: var(--rose-cream);
      touch-action: none;
    }

    #canvas-wrap {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* 상단 HUD */
    .hud-top {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      pointer-events: none;
    }

    .hud-pill {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 999px;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      color: var(--rose-cream);
      font-family: 'Noto Serif KR', serif;
      font-size: 12px;
      letter-spacing: 0.01em;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.24);
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
    }

    .hud-pill:active {
      transform: scale(0.96);
    }

    .hud-pill.active {
      background: linear-gradient(135deg, rgba(214, 118, 140, 0.92), rgba(156, 61, 84, 0.92));
      border-color: rgba(255, 224, 230, 0.65);
    }

    .hud-pill.garden-btn {
      background: linear-gradient(135deg, rgba(96, 145, 112, 0.92), rgba(56, 102, 74, 0.92));
      border-color: rgba(214, 245, 224, 0.55);
    }

    .hud-right {
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: auto;
    }

    .clue-count {
      color: #ffd7df;
      font-weight: 700;
    }

    /* 하단 조작 힌트 */
    .guide-toast {
      position: fixed;
      bottom: max(18px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(42, 20, 30, 0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(248, 212, 218, 0.28);
      color: rgba(255, 244, 246, 0.95);
      font-size: 12px;
      white-space: nowrap;
      pointer-events: none;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22);
      transition: opacity 0.35s ease;
    }

    /* 인트로 오버레이 */
    #intro-overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 35%, rgba(116, 52, 72, 0.75), rgba(28, 14, 21, 0.93));
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }

    #intro-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .intro-card {
      width: 100%;
      max-width: 420px;
      padding: 28px 24px 26px;
      border-radius: 24px;
      background: linear-gradient(165deg, rgba(66, 33, 47, 0.95), rgba(33, 17, 25, 0.97));
      border: 1px solid rgba(247, 209, 216, 0.38);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .intro-kicker {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #f7c7d0;
      margin-bottom: 8px;
    }

    .intro-title {
      font-size: 25px;
      font-weight: 700;
      color: #fff9fa;
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .intro-desc {
      font-size: 13.5px;
      line-height: 1.72;
      color: rgba(255, 240, 243, 0.9);
      margin-bottom: 22px;
    }

    .enter-btn {
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #df8a9d, #9d4158);
      color: #fffafb;
      font-family: 'Noto Serif KR', serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.03em;
      cursor: pointer;
      box-shadow: 0 10px 26px rgba(157, 65, 88, 0.45);
      transition: transform 0.18s ease, filter 0.18s ease;
    }

    .enter-btn:active {
      transform: scale(0.98);
      filter: brightness(1.06);
    }

    /* 편지 모달/시트 */
    .scrim {
      position: fixed;
      inset: 0;
      z-index: 28;
      background: rgba(18, 9, 14, 0.48);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .scrim.open {
      opacity: 1;
      visibility: visible;
    }

    .letter-sheet {
      position: fixed;
      left: 14px;
      right: 14px;
      bottom: max(14px, env(safe-area-inset-bottom));
      z-index: 30;
      max-width: 520px;
      margin: 0 auto;
      padding: 22px 22px 20px;
      border-radius: 20px;
      background:
        radial-gradient(circle at top right, rgba(235, 168, 182, 0.22), transparent 48%),
        linear-gradient(180deg, #fffcf9, #faefe9);
      border: 1.5px solid var(--letter-border);
      box-shadow:
        0 22px 54px rgba(0, 0, 0, 0.52),
        inset 0 0 0 4px rgba(255, 255, 255, 0.65);
      color: var(--letter-ink);
      transform: translateY(calc(100% + 32px));
      transition: transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .letter-sheet.open {
      transform: translateY(0);
    }

    .letter-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px dashed rgba(168, 92, 112, 0.32);
    }

    .letter-tag {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.16em;
      color: #a6465d;
    }

    .letter-seal {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #e36a84, #8f2d43);
      color: #fff6f8;
      font-size: 13px;
      box-shadow: 0 3px 8px rgba(143, 45, 67, 0.35);
    }

    .letter-title {
      font-size: 19px;
      font-weight: 700;
      color: #2f1821;
      margin-bottom: 12px;
    }

    .letter-greeting {
      font-size: 13px;
      color: #8c4b5c;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .letter-quote {
      padding: 12px 14px;
      margin-bottom: 12px;
      border-left: 3px solid #c96b82;
      background: rgba(232, 152, 170, 0.14);
      border-radius: 0 10px 10px 0;
      font-size: 14px;
      font-style: italic;
      line-height: 1.68;
      color: #46212e;
    }

    .letter-body {
      font-size: 13.5px;
      line-height: 1.75;
      color: #4b313b;
      margin-bottom: 16px;
    }

    .letter-actions {
      display: flex;
      gap: 10px;
    }

    .sheet-btn {
      flex: 1;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid rgba(152, 82, 100, 0.28);
      background: rgba(152, 82, 100, 0.08);
      color: #3a1d27;
      font-family: 'Noto Serif KR', serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .sheet-btn.primary {
      background: linear-gradient(135deg, #d4798e, #943b52);
      border-color: transparent;
      color: #fff9fa;
    }
  </style>
</head>
<body>
  <div id="canvas-wrap"></div>

  <div class="hud-top">
    <div class="hud-pill" id="clue-pill">
      <span>💌 편지</span>
      <span class="clue-count" id="clue-count">0</span>
      <span>/ <span id="clue-total">8</span></span>
    </div>

    <div class="hud-right">
      <button class="hud-pill garden-btn" id="zone-toggle" type="button">🌿 궁전 정원 산책</button>
      <button class="hud-pill" id="view-toggle" type="button">🏛️ 전체 조망 뷰</button>
      <button class="hud-pill active" id="audio-toggle" type="button">♪ 음악 ON</button>
    </div>
  </div>

  <div class="guide-toast" id="guide-toast">바닥 탭으로 이동 · 드래그로 시선 회전</div>

  <div id="intro-overlay">
    <div class="intro-card">
      <div class="intro-kicker">THE REMARRIED EMPRESS · ROSE CHAMBER &amp; GARDEN</div>
      <h1 class="intro-title">장미방 &amp; 슐라이스하임 궁전 정원</h1>
      <p class="intro-desc">
        화사한 로즈 벽지와 장미 아치가 빛나는 장미방 실내와, 긴 중앙 수로와 대칭 화단이 펼쳐진 슐라이스하임 궁전 정원을 자유롭게 걸어 보세요.<br>
        반짝이는 편지를 읽고, 상단 버튼으로 실내와 정원을 오가며 산책해 보세요.
      </p>
      <button class="enter-btn" id="enter-btn" type="button">공간으로 들어가기</button>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>
  <section class="letter-sheet" id="detail-sheet" aria-live="polite">
    <div class="letter-header">
      <span class="letter-tag" id="detail-tag">ROSE CHAMBER LETTER</span>
      <span class="letter-seal">🌹</span>
    </div>
    <h2 class="letter-title" id="detail-title">편지 제목</h2>
    <div class="letter-greeting" id="detail-greeting">남겨진 쪽지</div>
    <blockquote class="letter-quote" id="detail-quote">편지 구절</blockquote>
    <p class="letter-body" id="detail-body">편지 내용</p>
    <div class="letter-actions">
      <button class="sheet-btn" id="walk-here-btn" type="button">이곳으로 걸어가기</button>
      <button class="sheet-btn primary" id="close-sheet-btn" type="button">편지 접기</button>
    </div>
  </section>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // =========================================================
    // 1. 렌더러 & 공용 카메라 상태
    // =========================================================
    const wrap = document.getElementById('canvas-wrap');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf8e7e8);
    scene.fog = new THREE.FogExp2(0xf8e7e8, 0.011);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.18;
    wrap.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(56, window.innerWidth / window.innerHeight, 0.1, 140);
    const EYE_HEIGHT = 1.62;

    let currentZone = 'chamber'; // 'chamber' | 'garden'
    let isOverview = false;

    const player = {
      pos: new THREE.Vector3(0, EYE_HEIGHT, 6.2),
      yaw: 0,
      pitch: 0.02,
      targetPos: null,
      moveSpeed: 4.5,
      surface: 'carpet'
    };

    const overviewState = {
      pos: new THREE.Vector3(0, 12.4, 14.2),
      lookAt: new THREE.Vector3(0, 1.0, -0.5),
      targetPos: new THREE.Vector3(0, 12.4, 14.2),
      targetLookAt: new THREE.Vector3(0, 1.0, -0.5)
    };

    // =========================================================
    // 2. 프로시저럴 텍스처 생성기
    // =========================================================
    function makeRoseWallpaperTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 512, 512);
      grad.addColorStop(0, '#fff0ee');
      grad.addColorStop(0.5, '#fce4e4');
      grad.addColorStop(1, '#f7dadf');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);

      ctx.strokeStyle = 'rgba(196, 138, 148, 0.25)';
      ctx.lineWidth = 1.2;
      for (let y = 32; y < 512; y += 128) {
        for (let x = 32; x < 512; x += 128) {
          ctx.beginPath();
          ctx.moveTo(x, y - 44);
          ctx.quadraticCurveTo(x + 36, y, x, y + 44);
          ctx.quadraticCurveTo(x - 36, y, x, y - 44);
          ctx.stroke();
        }
      }

      function drawRose(cx, cy, r, mainCol, midCol) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.fillStyle = '#88ab8e';
        for (let i = 0; i < 4; i++) {
          ctx.save();
          ctx.rotate((i * Math.PI) / 2 + 0.4);
          ctx.beginPath();
          ctx.ellipse(r * 0.85, 0, r * 0.55, r * 0.22, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        ctx.fillStyle = mainCol;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = midCol;
        ctx.beginPath();
        ctx.arc(-r * 0.12, -r * 0.1, r * 0.65, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#cc5d75';
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.28, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      const centers = [[128, 128], [384, 128], [128, 384], [384, 384], [256, 256]];
      centers.forEach(([bx, by], idx) => {
        const tone = idx % 2 === 0 ? ['#f09eb0', '#ffd0da'] : ['#e48b9f', '#ffc6d3'];
        drawRose(bx, by, 17, tone[0], tone[1]);
        drawRose(bx - 22, by + 12, 11, '#f2aab9', '#ffd8e1');
        drawRose(bx + 21, by + 10, 12, '#e893a6', '#ffcbd6');
        drawRose(bx, by - 22, 10, '#f5b2c0', '#ffdfe6');
      });

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(2.2, 2.2);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeParquetTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#d6b08a';
      ctx.fillRect(0, 0, 512, 512);

      const tile = 128;
      for (let gy = 0; gy < 4; gy++) {
        for (let gx = 0; gx < 4; gx++) {
          const x = gx * tile;
          const y = gy * tile;
          ctx.fillStyle = (gx + gy) % 2 === 0 ? '#dcb792' : '#cfa780';
          ctx.fillRect(x, y, tile, tile);

          ctx.strokeStyle = 'rgba(130, 88, 52, 0.2)';
          ctx.lineWidth = 1;
          for (let s = 10; s < tile; s += 14) {
            ctx.beginPath();
            ctx.moveTo(x + s, y + 6);
            ctx.lineTo(x + s, y + tile - 6);
            ctx.stroke();
          }

          ctx.strokeStyle = 'rgba(154, 108, 68, 0.34)';
          ctx.lineWidth = 1.6;
          ctx.strokeRect(x + 8, y + 8, tile - 16, tile - 16);

          ctx.beginPath();
          ctx.moveTo(x + tile / 2, y + 22);
          ctx.lineTo(x + tile - 22, y + tile / 2);
          ctx.lineTo(x + tile / 2, y + tile - 22);
          ctx.lineTo(x + 22, y + tile / 2);
          ctx.closePath();
          ctx.stroke();
        }
      }

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(7, 8);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeRoundRugTexture() {
      const size = 1024;
      const c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      const ctx = c.getContext('2d');
      const cx = size / 2;
      const cy = size / 2;
      const maxR = size / 2 - 12;

      const bgGrad = ctx.createRadialGradient(cx, cy, 40, cx, cy, maxR);
      bgGrad.addColorStop(0, '#fff4f6');
      bgGrad.addColorStop(0.55, '#f6e4ec');
      bgGrad.addColorStop(0.84, '#e3cfe3');
      bgGrad.addColorStop(0.95, '#c9b1cb');
      bgGrad.addColorStop(1, '#b196b5');

      ctx.fillStyle = bgGrad;
      ctx.beginPath();
      ctx.arc(cx, cy, maxR, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = 'rgba(152, 104, 132, 0.45)';
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.arc(cx, cy, maxR - 36, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(198, 136, 152, 0.5)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(cx, cy, maxR - 72, 0, Math.PI * 2);
      ctx.stroke();

      const medGrad = ctx.createRadialGradient(cx, cy, 10, cx, cy, 150);
      medGrad.addColorStop(0, '#ffffff');
      medGrad.addColorStop(0.7, '#fad8e0');
      medGrad.addColorStop(1, 'rgba(240, 184, 198, 0)');
      ctx.fillStyle = medGrad;
      ctx.beginPath();
      ctx.arc(cx, cy, 150, 0, Math.PI * 2);
      ctx.fill();

      const petals = 16;
      for (let i = 0; i < petals; i++) {
        const ang = (i / petals) * Math.PI * 2;
        const r1 = maxR - 115;
        const x1 = cx + Math.cos(ang) * r1;
        const y1 = cy + Math.sin(ang) * r1;

        ctx.fillStyle = i % 2 === 0 ? '#e696a8' : '#ad9bc4';
        ctx.beginPath();
        ctx.arc(x1, y1, 20, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fff0f4';
        ctx.beginPath();
        ctx.arc(x1, y1, 8, 0, Math.PI * 2);
        ctx.fill();

        const r2 = maxR * 0.46;
        const x2 = cx + Math.cos(ang + 0.18) * r2;
        const y2 = cy + Math.sin(ang + 0.18) * r2;
        ctx.fillStyle = 'rgba(202, 128, 146, 0.62)';
        ctx.beginPath();
        ctx.arc(x2, y2, 13, 0, Math.PI * 2);
        ctx.fill();
      }

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeStainedGlassTexture() {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 512;
      const ctx = c.getContext('2d');

      const g = ctx.createLinearGradient(0, 0, 0, 512);
      g.addColorStop(0, '#fff7d4');
      g.addColorStop(0.5, '#ffece6');
      g.addColorStop(1, '#e4f4f8');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 256, 512);

      const panels = [
        [18, 22, 102, 135, '#f4b5c2'],
        [136, 22, 102, 135, '#aed6e3'],
        [18, 174, 220, 145, '#ffd4a8'],
        [18, 336, 102, 152, '#c5e0ce'],
        [136, 336, 102, 152, '#f5bec9']
      ];

      panels.forEach(([x, y, w, h, col]) => {
        ctx.fillStyle = col;
        ctx.fillRect(x, y, w, h);
        ctx.fillStyle = '#e07e94';
        ctx.beginPath();
        ctx.arc(x + w / 2, y + h / 2, Math.min(w, h) * 0.24, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff8fa';
        ctx.beginPath();
        ctx.arc(x + w / 2, y + h / 2, Math.min(w, h) * 0.1, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.strokeStyle = '#7c655b';
      ctx.lineWidth = 7;
      ctx.strokeRect(12, 16, 232, 480);
      panels.forEach(([x, y, w, h]) => {
        ctx.strokeRect(x, y, w, h);
      });

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
