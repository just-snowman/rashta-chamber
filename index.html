<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>라스타의 황실 침실 · 장미방 (Rose Chamber)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --rose-cream: #fff7f8;
      --rose-blush: #f2bcc6;
      --rose-deep: #9c3d54;
      --sage-mint: #a8c7bb;
      --gold-leaf: #e3be7b;
      --letter-paper: #fffaf5;
      --letter-border: #e5c3c9;
      --letter-ink: #3a212a;
      --glass-bg: rgba(46, 22, 32, 0.68);
      --glass-border: rgba(248, 212, 218, 0.34);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #24131b;
      font-family: 'Noto Serif KR', Georgia, serif;
      color: var(--rose-cream);
      touch-action: none;
    }

    #canvas-wrap {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* 상단 HUD */
    .hud-top {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      left: 14px;
      right: 14px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      pointer-events: none;
    }

    .hud-pill {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 13px;
      border-radius: 999px;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      color: var(--rose-cream);
      font-family: 'Noto Serif KR', serif;
      font-size: 12.5px;
      letter-spacing: 0.02em;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.24);
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
    }

    .hud-pill:active {
      transform: scale(0.96);
    }

    .hud-pill.active {
      background: linear-gradient(135deg, rgba(214, 118, 140, 0.92), rgba(156, 61, 84, 0.92));
      border-color: rgba(255, 224, 230, 0.65);
    }

    .hud-right {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }

    .clue-count {
      color: #ffd7df;
      font-weight: 700;
    }

    /* 하단 조작 힌트 */
    .guide-toast {
      position: fixed;
      bottom: max(18px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(42, 20, 30, 0.68);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(248, 212, 218, 0.28);
      color: rgba(255, 244, 246, 0.95);
      font-size: 12px;
      white-space: nowrap;
      pointer-events: none;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22);
      transition: opacity 0.35s ease;
    }

    /* 인트로 오버레이 */
    #intro-overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 35%, rgba(116, 52, 72, 0.72), rgba(28, 14, 21, 0.92));
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }

    #intro-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .intro-card {
      width: 100%;
      max-width: 420px;
      padding: 28px 24px 26px;
      border-radius: 24px;
      background: linear-gradient(165deg, rgba(66, 33, 47, 0.94), rgba(33, 17, 25, 0.96));
      border: 1px solid rgba(247, 209, 216, 0.38);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .intro-kicker {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #f7c7d0;
      margin-bottom: 8px;
    }

    .intro-title {
      font-size: 26px;
      font-weight: 700;
      color: #fff9fa;
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .intro-desc {
      font-size: 13.5px;
      line-height: 1.72;
      color: rgba(255, 240, 243, 0.9);
      margin-bottom: 22px;
    }

    .enter-btn {
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #df8a9d, #9d4158);
      color: #fffafb;
      font-family: 'Noto Serif KR', serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.03em;
      cursor: pointer;
      box-shadow: 0 10px 26px rgba(157, 65, 88, 0.45);
      transition: transform 0.18s ease, filter 0.18s ease;
    }

    .enter-btn:active {
      transform: scale(0.98);
      filter: brightness(1.06);
    }

    /* 편지 모달/시트 */
    .scrim {
      position: fixed;
      inset: 0;
      z-index: 28;
      background: rgba(18, 9, 14, 0.48);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .scrim.open {
      opacity: 1;
      visibility: visible;
    }

    .letter-sheet {
      position: fixed;
      left: 14px;
      right: 14px;
      bottom: max(14px, env(safe-area-inset-bottom));
      z-index: 30;
      max-width: 520px;
      margin: 0 auto;
      padding: 22px 22px 20px;
      border-radius: 20px;
      background:
        radial-gradient(circle at top right, rgba(235, 168, 182, 0.22), transparent 48%),
        linear-gradient(180deg, #fffcf9, #faefe9);
      border: 1.5px solid var(--letter-border);
      box-shadow:
        0 22px 54px rgba(0, 0, 0, 0.52),
        inset 0 0 0 4px rgba(255, 255, 255, 0.65);
      color: var(--letter-ink);
      transform: translateY(calc(100% + 32px));
      transition: transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .letter-sheet.open {
      transform: translateY(0);
    }

    .letter-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px dashed rgba(168, 92, 112, 0.32);
    }

    .letter-tag {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.16em;
      color: #a6465d;
    }

    .letter-seal {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #e36a84, #8f2d43);
      color: #fff6f8;
      font-size: 13px;
      box-shadow: 0 3px 8px rgba(143, 45, 67, 0.35);
    }

    .letter-title {
      font-size: 19px;
      font-weight: 700;
      color: #2f1821;
      margin-bottom: 12px;
    }

    .letter-greeting {
      font-size: 13px;
      color: #8c4b5c;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .letter-quote {
      padding: 12px 14px;
      margin-bottom: 12px;
      border-left: 3px solid #c96b82;
      background: rgba(232, 152, 170, 0.14);
      border-radius: 0 10px 10px 0;
      font-size: 14px;
      font-style: italic;
      line-height: 1.68;
      color: #46212e;
    }

    .letter-body {
      font-size: 13.5px;
      line-height: 1.75;
      color: #4b313b;
      margin-bottom: 16px;
    }

    .letter-actions {
      display: flex;
      gap: 10px;
    }

    .sheet-btn {
      flex: 1;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid rgba(152, 82, 100, 0.28);
      background: rgba(152, 82, 100, 0.08);
      color: #3a1d27;
      font-family: 'Noto Serif KR', serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .sheet-btn.primary {
      background: linear-gradient(135deg, #d4798e, #943b52);
      border-color: transparent;
      color: #fff9fa;
    }
  </style>
</head>
<body>
  <div id="canvas-wrap"></div>

  <div class="hud-top">
    <div class="hud-pill" id="clue-pill">
      <span>💌 장미방 편지</span>
      <span class="clue-count" id="clue-count">0</span>
      <span>/ 8</span>
    </div>

    <div class="hud-right">
      <button class="hud-pill" id="view-toggle" type="button">🏛️ 전체 조망 뷰</button>
      <button class="hud-pill active" id="audio-toggle" type="button">♪ 음악 ON</button>
    </div>
  </div>

  <div class="guide-toast" id="guide-toast">바닥·가구 탭으로 이동 · 드래그로 시선 회전</div>

  <div id="intro-overlay">
    <div class="intro-card">
      <div class="intro-kicker">THE REMARRIED EMPRESS · ROSE CHAMBER</div>
      <h1 class="intro-title">라스타의 황실 침실 · 장미방</h1>
      <p class="intro-desc">
        화사한 로즈 벽지와 장미 덩굴 아치, 스테인드글라스와 세 개의 샹들리에가 빛나는 장미방.<br>
        반짝이는 단서를 눌러 숨겨진 편지를 읽고, 걸음을 옮기며 바닥마다 다른 발소리를 들어 보세요.
      </p>
      <button class="enter-btn" id="enter-btn" type="button">장미방 안으로 들어가기</button>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>
  <section class="letter-sheet" id="detail-sheet" aria-live="polite">
    <div class="letter-header">
      <span class="letter-tag">ROSE CHAMBER LETTER</span>
      <span class="letter-seal">🌹</span>
    </div>
    <h2 class="letter-title" id="detail-title">편지 제목</h2>
    <div class="letter-greeting" id="detail-greeting">장미방에서 남긴 쪽지</div>
    <blockquote class="letter-quote" id="detail-quote">편지 구절</blockquote>
    <p class="letter-body" id="detail-body">편지 내용</p>
    <div class="letter-actions">
      <button class="sheet-btn" id="walk-here-btn" type="button">이곳으로 걸어가기</button>
      <button class="sheet-btn primary" id="close-sheet-btn" type="button">편지 접기</button>
    </div>
  </section>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // =========================================================
    // 1. 캔버스 & 렌더러 설정 (화사한 톤맵 & 모바일 세로형 최적화)
    // =========================================================
    const wrap = document.getElementById('canvas-wrap');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf8e7e8);
    scene.fog = new THREE.FogExp2(0xf8e7e8, 0.011);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.18;
    wrap.appendChild(renderer.domElement);

    const ROOM_W = 18;
    const ROOM_D = 22;
    const WALL_H = 6.8;
    const HALF_W = ROOM_W / 2;
    const HALF_D = ROOM_D / 2;

    const camera = new THREE.PerspectiveCamera(56, window.innerWidth / window.innerHeight, 0.1, 90);
    const EYE_HEIGHT = 1.62;

    const player = {
      pos: new THREE.Vector3(0, EYE_HEIGHT, 6.2),
      yaw: 0,
      pitch: 0.02,
      targetPos: null,
      moveSpeed: 4.3,
      surface: 'carpet'
    };

    let isOverview = false;
    const overviewState = {
      pos: new THREE.Vector3(0, 12.4, 14.2),
      lookAt: new THREE.Vector3(0, 1.0, -0.5),
      targetPos: new THREE.Vector3(0, 12.4, 14.2),
      targetLookAt: new THREE.Vector3(0, 1.0, -0.5)
    };

    // =========================================================
    // 2. 프로시저럴 텍스처 생성기 (더 화사해진 로즈 벽지, 파케 마루, 원형 러그, 스테인드글라스)
    // =========================================================
    function makeRoseWallpaperTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 512, 512);
      grad.addColorStop(0, '#fff0ee');
      grad.addColorStop(0.5, '#fce4e4');
      grad.addColorStop(1, '#f7dadf');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);

      ctx.strokeStyle = 'rgba(196, 138, 148, 0.25)';
      ctx.lineWidth = 1.2;
      for (let y = 32; y < 512; y += 128) {
        for (let x = 32; x < 512; x += 128) {
          ctx.beginPath();
          ctx.moveTo(x, y - 44);
          ctx.quadraticCurveTo(x + 36, y, x, y + 44);
          ctx.quadraticCurveTo(x - 36, y, x, y - 44);
          ctx.stroke();
        }
      }

      function drawRose(cx, cy, r, mainCol, midCol) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.fillStyle = '#88ab8e';
        for (let i = 0; i < 4; i++) {
          ctx.save();
          ctx.rotate((i * Math.PI) / 2 + 0.4);
          ctx.beginPath();
          ctx.ellipse(r * 0.85, 0, r * 0.55, r * 0.22, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        ctx.fillStyle = mainCol;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = midCol;
        ctx.beginPath();
        ctx.arc(-r * 0.12, -r * 0.1, r * 0.65, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#cc5d75';
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.28, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      const centers = [
        [128, 128], [384, 128],
        [128, 384], [384, 384],
        [256, 256]
      ];
      centers.forEach(([bx, by], idx) => {
        const tone = idx % 2 === 0 ? ['#f09eb0', '#ffd0da'] : ['#e48b9f', '#ffc6d3'];
        drawRose(bx, by, 17, tone[0], tone[1]);
        drawRose(bx - 22, by + 12, 11, '#f2aab9', '#ffd8e1');
        drawRose(bx + 21, by + 10, 12, '#e893a6', '#ffcbd6');
        drawRose(bx, by - 22, 10, '#f5b2c0', '#ffdfe6');
      });

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(2.2, 2.2);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeParquetTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');

      ctx.fillStyle = '#d6b08a';
      ctx.fillRect(0, 0, 512, 512);

      const tile = 128;
      for (let gy = 0; gy < 4; gy++) {
        for (let gx = 0; gx < 4; gx++) {
          const x = gx * tile;
          const y = gy * tile;
          ctx.fillStyle = (gx + gy) % 2 === 0 ? '#dcb792' : '#cfa780';
          ctx.fillRect(x, y, tile, tile);

          ctx.strokeStyle = 'rgba(130, 88, 52, 0.2)';
          ctx.lineWidth = 1;
          for (let s = 10; s < tile; s += 14) {
            ctx.beginPath();
            ctx.moveTo(x + s, y + 6);
            ctx.lineTo(x + s, y + tile - 6);
            ctx.stroke();
          }

          ctx.strokeStyle = 'rgba(154, 108, 68, 0.34)';
          ctx.lineWidth = 1.6;
          ctx.strokeRect(x + 8, y + 8, tile - 16, tile - 16);

          ctx.beginPath();
          ctx.moveTo(x + tile / 2, y + 22);
          ctx.lineTo(x + tile - 22, y + tile / 2);
          ctx.lineTo(x + tile / 2, y + tile - 22);
          ctx.lineTo(x + 22, y + tile / 2);
          ctx.closePath();
          ctx.stroke();
        }
      }

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(7, 8);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeRoundRugTexture() {
      const size = 1024;
      const c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      const ctx = c.getContext('2d');
      const cx = size / 2;
      const cy = size / 2;
      const maxR = size / 2 - 12;

      const bgGrad = ctx.createRadialGradient(cx, cy, 40, cx, cy, maxR);
      bgGrad.addColorStop(0, '#fff4f6');
      bgGrad.addColorStop(0.55, '#f6e4ec');
      bgGrad.addColorStop(0.84, '#e3cfe3');
      bgGrad.addColorStop(0.95, '#c9b1cb');
      bgGrad.addColorStop(1, '#b196b5');

      ctx.fillStyle = bgGrad;
      ctx.beginPath();
      ctx.arc(cx, cy, maxR, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = 'rgba(152, 104, 132, 0.45)';
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.arc(cx, cy, maxR - 36, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(198, 136, 152, 0.5)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(cx, cy, maxR - 72, 0, Math.PI * 2);
      ctx.stroke();

      const medGrad = ctx.createRadialGradient(cx, cy, 10, cx, cy, 150);
      medGrad.addColorStop(0, '#ffffff');
      medGrad.addColorStop(0.7, '#fad8e0');
      medGrad.addColorStop(1, 'rgba(240, 184, 198, 0)');
      ctx.fillStyle = medGrad;
      ctx.beginPath();
      ctx.arc(cx, cy, 150, 0, Math.PI * 2);
      ctx.fill();

      const petals = 16;
      for (let i = 0; i < petals; i++) {
        const ang = (i / petals) * Math.PI * 2;
        const r1 = maxR - 115;
        const x1 = cx + Math.cos(ang) * r1;
        const y1 = cy + Math.sin(ang) * r1;

        ctx.fillStyle = i % 2 === 0 ? '#e696a8' : '#ad9bc4';
        ctx.beginPath();
        ctx.arc(x1, y1, 20, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fff0f4';
        ctx.beginPath();
        ctx.arc(x1, y1, 8, 0, Math.PI * 2);
        ctx.fill();

        const r2 = maxR * 0.46;
        const x2 = cx + Math.cos(ang + 0.18) * r2;
        const y2 = cy + Math.sin(ang + 0.18) * r2;
        ctx.fillStyle = 'rgba(202, 128, 146, 0.62)';
        ctx.beginPath();
        ctx.arc(x2, y2, 13, 0, Math.PI * 2);
        ctx.fill();
      }

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeStainedGlassTexture() {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 512;
      const ctx = c.getContext('2d');

      const g = ctx.createLinearGradient(0, 0, 0, 512);
      g.addColorStop(0, '#fff7d4');
      g.addColorStop(0.5, '#ffece6');
      g.addColorStop(1, '#e4f4f8');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 256, 512);

      const panels = [
        [18, 22, 102, 135, '#f4b5c2'],
        [136, 22, 102, 135, '#aed6e3'],
        [18, 174, 220, 145, '#ffd4a8'],
        [18, 336, 102, 152, '#c5e0ce'],
        [136, 336, 102, 152, '#f5bec9']
      ];

      panels.forEach(([x, y, w, h, col]) => {
        ctx.fillStyle = col;
        ctx.fillRect(x, y, w, h);
        ctx.fillStyle = '#e07e94';
        ctx.beginPath();
        ctx.arc(x + w / 2, y + h / 2, Math.min(w, h) * 0.24, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff8fa';
        ctx.beginPath();
        ctx.arc(x + w / 2, y + h / 2, Math.min(w, h) * 0.1, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.strokeStyle = '#7c655b';
      ctx.lineWidth = 7;
      ctx.strokeRect(12, 16, 232, 480);
      panels.forEach(([x, y, w, h]) => {
        ctx.strokeRect(x, y, w, h);
      });

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const roseWallTex = makeRoseWallpaperTexture();
    const parquetTex = makeParquetTexture();

      laceTop.position.y = 0.76;
      tg.add(laceTop);

      pot.position.y = 0.88;
      const blooms = new THREE.Mesh(new THREE.DodecahedronGeometry(0.2, 1), mats.lavenderVelvet);
      blooms.position.y = 1.06;
      tg.add(pot, blooms);

        const ch = new THREE.Group();
        ch.position.set(Math.cos(ang) * dist, 0, Math.sin(ang) * dist);
        ch.lookAt(x, 0, z);

        const seat = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.28, 0.12, 16), mats.beigeDrapery);
        seat.position.y = 0.46;

        const back = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.52, 0.08), mats.ivoryWood);
        back.position.set(0, 0.76, -0.26);

        greeting: '장미 화환이 드리운 자리에서 · 비밀 쪽지',
        quote: '“장미 꽃잎이 떨어지듯, 이 방의 모든 시선이 나를 향하고 있어요.”',
        body: '초록 덩굴과 분홍 장미가 아치형으로 감싸고 스테인드글라스 채광이 스며드는 장미방의 가장 화사한 자리에서 발견한 편지입니다.',
        pos: new THREE.Vector3(0, 1.55, -5.2),
        walkPos: new THREE.Vector3(0, EYE_HEIGHT, -3.4)
      },
      {
        id: 'canopy-bed',
        title: '버건디 커튼 뒤의 짧은 편지',
        greeting: '캐노피 침대 머리맡 · 접힌 편지지',
        quote: '“짙은 장미빛 커튼 뒤에서는 황궁의 소란도 잠시 멈추죠.”',
        body: '단상 위의 아이보리 침대와 버건디 벨벳 커튼 사이, 조용한 밤에만 펼쳐 보던 짧은 편지가 놓여 있습니다.',
        pos: new THREE.Vector3(0, 1.45, -7.2),
        walkPos: new THREE.Vector3(0, EYE_HEIGHT, -4.3)
      },
      {
        id: 'vanity-mirror',
        title: '3단 거울 화장대 서랍의 편지',
        greeting: '화장대 보석함 옆 · 향기 나는 편지',
        quote: '“가장 화사한 장미가 어울리는 날, 거울 속 나도 특별해 보여야 해요.”',
        body: '세 개의 거울과 모자·보석함이 놓인 화장대 위, 장미 향수가 살짝 배어 있는 분홍빛 편지입니다.',
        pos: new THREE.Vector3(-6.5, 1.4, -2.4),
        walkPos: new THREE.Vector3(-4.6, EYE_HEIGHT, -2.4)
      },
      {
        id: 'blue-chaise',
        title: '파스텔 블루 셰즈롱 쿠션 밑 편지',
        greeting: '하늘빛 셰즈롱 위 · 낮잠 시간의 편지',
        quote: '“연한 하늘빛 벨벳 위에 기대면 오후의 나른함이 살포시 내려앉아요.”',
        body: '장미 무늬 벽지와 어우러진 파스텔 블루 셰즈롱 위에 살짝 접어 둔 오후의 편지입니다.',
        pos: new THREE.Vector3(6.1, 1.25, -2.8),
        walkPos: new THREE.Vector3(4.3, EYE_HEIGHT, -2.8)
      },
      {
        id: 'marble-fireplace',
        title: '대리석 벽난로 장미 화병 옆 편지',
        greeting: '벽난로 선반 위 · 따뜻한 편지',
        quote: '“꽃다발이 시들지 않도록, 따뜻한 온기만 남겨둘게요.”',
        body: '크림빛 대리석 벽난로 선반 위 장미 화병 곁에 기대어 놓인 다정한 편지입니다.',
        pos: new THREE.Vector3(6.6, 1.75, 2.6),
        walkPos: new THREE.Vector3(4.5, EYE_HEIGHT, 2.6)
      },
      {
        id: 'blue-tea-table',
        title: '플로럴 티테이블 찻잔 옆 편지',
        greeting: '다과 테이블 위 · 초대 편지',
        quote: '“달콤한 다과와 향긋한 차 한 잔이면, 오늘 하루도 완벽해요.”',
        body: '푸른빛 플로럴 테이블보 위, 차를 마시며 나누려던 이야기가 적힌 편지입니다.',
        pos: new THREE.Vector3(2.3, 1.35, 2.2),
        walkPos: new THREE.Vector3(0.7, EYE_HEIGHT, 2.2)
      },
      {
        id: 'rose-tea-table',
        title: '로즈 벨벳 티테이블 레이스 위 편지',
        greeting: '작은 원형 테이블 · 속삭이는 편지',
        quote: '“분홍빛 레이스가 둘러진 자리에서 나누는 이야기들은 언제나 달콤하죠.”',
        body: '로즈 벨벳 크로스와 레이스가 어우러진 작은 티테이블 위에 놓인 비밀스러운 편지입니다.',
        pos: new THREE.Vector3(3.6, 1.3, 4.1),
        walkPos: new THREE.Vector3(1.8, EYE_HEIGHT, 4.5)
      },
      {
        id: 'draped-windows',
        title: '아치형 커튼 창가에서 발견한 편지',
        greeting: '창가 살롱 · 햇살 머금은 편지',
        quote: '“빛이 쏟아지는 창가와 반짝이는 샹들리에 아래, 이곳은 나만의 무대예요.”',
        body: '로즈 베이지 커튼이 드리운 창가와 세 개의 크리스털 샹들리에 아래에서 발견한 편지입니다.',
        pos: new THREE.Vector3(0, 1.6, 8.6),
        walkPos: new THREE.Vector3(0, EYE_HEIGHT, 6.4)
      }
    ];

    const discovered = new Set();
    const clueMarkers = [];
    const markerMatDefault = new THREE.MeshStandardMaterial({
      color: 0xffe0e8,
      emissive: 0xf07894,
      emissiveIntensity: 0.85,
      roughness: 0.18,
      metalness: 0.5
    });
    const markerMatFound = new THREE.MeshStandardMaterial({
      color: 0xfff0ba,
      emissive: 0xe0ad52,
      emissiveIntensity: 0.5,
      roughness: 0.24,
      metalness: 0.65
    });

    CLUES.forEach((clue, idx) => {
      const mg = new THREE.Group();
      mg.position.copy(clue.pos);

      const gem = new THREE.Mesh(new THREE.OctahedronGeometry(0.25, 0), markerMatDefault.clone());
      gem.scale.set(0.85, 1.35, 0.85);
      gem.userData = { clueIndex: idx };
      mg.add(gem);

      const ring = new THREE.Mesh(
        new THREE.RingGeometry(0.32, 0.38, 24),
        new THREE.MeshBasicMaterial({ color: 0xfff0f4, side: THREE.DoubleSide, transparent: true, opacity: 0.78 })
      );
      ring.rotation.x = Math.PI / 2;
      ring.position.y = -0.32;
      mg.add(ring);

      scene.add(mg);
      clueMarkers.push({ group: mg, gem, ring, baseY: clue.pos.y, index: idx });
    });

    // =========================================================
    // 7. Web Audio (오르골·하프 아르페지오 배경음 + 바닥 재질별 발소리)
    // =========================================================
    const audioCtxHolder = { ctx: null, enabled: true, timerId: null, step: 0 };

    function ensureAudio() {
      if (!audioCtxHolder.ctx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtxHolder.ctx = new Ctx();
      }
      if (audioCtxHolder.ctx && audioCtxHolder.ctx.state === 'suspended') {
        audioCtxHolder.ctx.resume().catch(() => {});
      }
      return audioCtxHolder.ctx;
    }

    const ARP_NOTES = [
      523.25, 659.25, 783.99, 987.77,
      493.88, 659.25, 783.99, 987.77,
      440.00, 659.25, 783.99, 880.00,
      392.00, 587.33, 783.99, 987.77
    ];

    function playArpNote(freq) {
      if (!audioCtxHolder.enabled) return;
      const ctx = ensureAudio();
      if (!ctx) return;

      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.036, now + 0.025);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.4);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 1.45);
    }

    function startMusicLoop() {
      if (audioCtxHolder.timerId) return;
      audioCtxHolder.timerId = setInterval(() => {
        if (!audioCtxHolder.enabled) return;
        const note = ARP_NOTES[audioCtxHolder.step % ARP_NOTES.length];
        playArpNote(note);
        audioCtxHolder.step += 1;
      }, 420);
    }

    function playFootstep(surface) {
      if (!audioCtxHolder.enabled) return;
      const ctx = ensureAudio();
      if (!ctx) return;

      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      if (surface === 'carpet') {
        // 폭신한 러그/카펫 발소리
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(125, now);
        osc.frequency.exponentialRampToValueAtTime(54, now + 0.1);
        gain.gain.setValueAtTime(0.075, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
      } else {
        // 원목 마루 발소리
        osc.type = 'sine';
        osc.frequency.setValueAtTime(215, now);
        osc.frequency.exponentialRampToValueAtTime(82, now + 0.08);
        gain.gain.setValueAtTime(0.085, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
      }

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.12);
    }

    // =========================================================
    // 8. UI & 상호작용
    // =========================================================
    const clueCountEl = document.getElementById('clue-count');
    const viewToggleBtn = document.getElementById('view-toggle');
    const audioToggleBtn = document.getElementById('audio-toggle');
    const guideToast = document.getElementById('guide-toast');
    const introOverlay = document.getElementById('intro-overlay');
    const enterBtn = document.getElementById('enter-btn');
    const scrim = document.getElementById('scrim');
    const detailSheet = document.getElementById('detail-sheet');
    const detailTitle = document.getElementById('detail-title');
    const detailGreeting = document.getElementById('detail-greeting');
    const detailQuote = document.getElementById('detail-quote');
    const detailBody = document.getElementById('detail-body');
    const walkHereBtn = document.getElementById('walk-here-btn');
    const closeSheetBtn = document.getElementById('close-sheet-btn');

    let activeClue = null;

    function openClueSheet(clue, index) {
      activeClue = clue;
      detailTitle.textContent = clue.title;
      detailGreeting.textContent = clue.greeting;
      detailQuote.textContent = clue.quote;
      detailBody.textContent = clue.body;

      if (!discovered.has(index)) {
        discovered.add(index);
        clueCountEl.textContent = String(discovered.size);
        const m = clueMarkers[index];
        if (m) m.gem.material = markerMatFound;
      }

      scrim.classList.add('open');
      detailSheet.classList.add('open');
    }

    function closeClueSheet() {
      scrim.classList.remove('open');
      detailSheet.classList.remove('open');
      activeClue = null;
    }

    closeSheetBtn.addEventListener('click', closeClueSheet);
    scrim.addEventListener('click', closeClueSheet);

    walkHereBtn.addEventListener('click', () => {
      if (!activeClue) return;
      const dest = activeClue.walkPos.clone();
      closeClueSheet();
      if (isOverview) {
        toggleViewMode(false);
      }
      player.targetPos = dest;
    });

    function toggleViewMode(forceOverview) {
      isOverview = typeof forceOverview === 'boolean' ? forceOverview : !isOverview;
      if (isOverview) {
        viewToggleBtn.textContent = '👁️ 눈높이 시점';
        viewToggleBtn.classList.add('active');
        guideToast.textContent = '전체 조망 뷰 · 바닥을 탭하면 그 자리로 먼저 이동합니다';
      } else {
        viewToggleBtn.textContent = '🏛️ 전체 조망 뷰';
        viewToggleBtn.classList.remove('active');
        guideToast.textContent = '바닥·가구 탭으로 이동 · 드래그로 시선 회전';
      }
    }

    viewToggleBtn.addEventListener('click', () => toggleViewMode());

    audioToggleBtn.addEventListener('click', () => {
      audioCtxHolder.enabled = !audioCtxHolder.enabled;
      if (audioCtxHolder.enabled) {
        ensureAudio();
        startMusicLoop();
        audioToggleBtn.textContent = '♪ 음악 ON';
        audioToggleBtn.classList.add('active');
      } else {
        audioToggleBtn.textContent = '♪ 음악 OFF';
        audioToggleBtn.classList.remove('active');
      }
    });

    enterBtn.addEventListener('click', () => {
      introOverlay.classList.add('hidden');
      ensureAudio();
      startMusicLoop();
    });

    const raycaster = new THREE.Raycaster();
    const pointerNdc = new THREE.Vector2();

    function clampToRoom(v) {
      const margin = 1.1;
      v.x = Math.max(-HALF_W + margin, Math.min(HALF_W - margin, v.x));
      v.z = Math.max(-HALF_D + margin, Math.min(HALF_D - margin, v.z));
      for (const ob of obstacles) {
        const dx = v.x - ob.x;
        const dz = v.z - ob.z;
        const dist = Math.hypot(dx, dz);
        const minDist = ob.r + 0.55;
        if (dist < minDist && dist > 0.0001) {
          v.x = ob.x + (dx / dist) * minDist;
          v.z = ob.z + (dz / dist) * minDist;
        }
      }
      v.y = EYE_HEIGHT;
      return v;
    }

    let pointerDownPos = { x: 0, y: 0 };
    let isDragging = false;
    let lastDragPos = { x: 0, y: 0 };

    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (detailSheet.classList.contains('open')) return;
      ensureAudio();
      pointerDownPos = { x: e.clientX, y: e.clientY };
      lastDragPos = { x: e.clientX, y: e.clientY };
      isDragging = true;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging || detailSheet.classList.contains('open')) return;
      const dx = e.clientX - lastDragPos.x;
      const dy = e.clientY - lastDragPos.y;
      lastDragPos = { x: e.clientX, y: e.clientY };

      if (!isOverview) {
        player.yaw -= dx * 0.0052;
        player.pitch = Math.max(-0.52, Math.min(0.52, player.pitch - dy * 0.0042));
      } else {
        overviewState.targetPos.x = Math.max(-7.5, Math.min(7.5, overviewState.targetPos.x - dx * 0.015));
        overviewState.targetPos.z = Math.max(3.0, Math.min(16.5, overviewState.targetPos.z - dy * 0.015));
      }
    });

    window.addEventListener('pointerup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      if (detailSheet.classList.contains('open')) return;

      const movedDist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      if (movedDist > 9) return;

      const rect = renderer.domElement.getBoundingClientRect();
      pointerNdc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointerNdc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(pointerNdc, camera);

      // 1) 반짝이는 편지 단서 선택
      const gemTargets = clueMarkers.map((m) => m.gem);
      const gemHits = raycaster.intersectObjects(gemTargets, false);
      if (gemHits.length > 0) {
        const idx = gemHits[0].object.userData.clueIndex;
        if (typeof idx === 'number' && CLUES[idx]) {
          openClueSheet(CLUES[idx], idx);
          return;
        }
      }

      // 2) 바닥 탭 이동: 전체 조망 뷰에서는 시점을 강제로 낮추지 않고 이동 목표만 설정
      const floorHits = raycaster.intersectObjects(floorHitMeshes, false);
      if (floorHits.length > 0) {
        const pt = floorHits[0].point.clone();
        const dest = clampToRoom(pt);
        player.targetPos = dest;
        if (isOverview) {
          guideToast.textContent = '선택한 위치로 이동 중 · 눈높이 보기는 상단 [👁️ 눈높이 시점] 버튼';
        }
      }
    });

    // =========================================================
    // 9. 애니메이션 루프
    // =========================================================
    const clock = new THREE.Clock();
    let stepAccum = 0;

    function updatePlayerMovement(dt) {
      if (player.targetPos) {
        const toTarget = new THREE.Vector3().subVectors(player.targetPos, player.pos);
        toTarget.y = 0;
        const dist = toTarget.length();
        if (dist < 0.12) {
          player.targetPos = null;
        } else {
          toTarget.normalize();
          const stepLen = Math.min(dist, player.moveSpeed * dt);
          player.pos.addScaledVector(toTarget, stepLen);
          clampToRoom(player.pos);

          const desiredYaw = Math.atan2(-toTarget.x, -toTarget.z);
          let diff = desiredYaw - player.yaw;
          while (diff > Math.PI) diff -= Math.PI * 2;
          while (diff < -Math.PI) diff += Math.PI * 2;
          player.yaw += diff * Math.min(1, dt * 7);

          const onRug = Math.hypot(player.pos.x, player.pos.z - 0.2) <= 6.4;
          player.surface = onRug ? 'carpet' : 'wood';
          stepAccum += stepLen;
          if (stepAccum >= 1.05) {
            stepAccum = 0;
            playFootstep(player.surface);
          }
        }
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.getElapsedTime();

      updatePlayerMovement(dt);

      clueMarkers.forEach((m) => {
        m.gem.rotation.y = elapsed * 1.6 + m.index;
        m.gem.position.y = Math.sin(elapsed * 2.4 + m.index) * 0.08;
        m.ring.position.y = -0.32 + Math.sin(elapsed * 2.4 + m.index) * 0.06;
      });

      chandeliers.forEach((ch, i) => {
        ch.rotation.z = Math.sin(elapsed * 0.9 + i) * 0.015;
      });

      if (isOverview) {
        overviewState.pos.lerp(overviewState.targetPos, Math.min(1, dt * 6));
        overviewState.lookAt.lerp(overviewState.targetLookAt, Math.min(1, dt * 6));
        camera.position.copy(overviewState.pos);
        camera.lookAt(overviewState.lookAt);
      } else {
        const bob = player.targetPos ? Math.sin(elapsed * 12) * 0.035 : Math.sin(elapsed * 1.8) * 0.008;
        camera.position.set(player.pos.x, player.pos.y + bob, player.pos.z);

        const euler = new THREE.Euler(player.pitch, player.yaw, 0, 'YXZ');
        camera.quaternion.setFromEuler(euler);
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
