<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>라스타의 황실 침실 · 장미방 (Rose Chamber)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --rose-cream: #f9efe9;
      --rose-blush: #e8b7be;
      --rose-deep: #8b3a4a;
      --sage-mint: #9ab8ad;
      --gold-leaf: #d7b272;
      --plum-ink: #2a1820;
      --glass-bg: rgba(34, 19, 26, 0.72);
      --glass-border: rgba(235, 195, 198, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a0f14;
      font-family: 'Noto Serif KR', Georgia, serif;
      color: var(--rose-cream);
      touch-action: none;
    }

    #canvas-wrap {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* 상단 HUD */
    .hud-top {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      left: 14px;
      right: 14px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      pointer-events: none;
    }

    .hud-pill {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 13px;
      border-radius: 999px;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      color: var(--rose-cream);
      font-family: 'Noto Serif KR', serif;
      font-size: 12.5px;
      letter-spacing: 0.02em;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
    }

    .hud-pill:active {
      transform: scale(0.96);
    }

    .hud-pill.active {
      background: rgba(139, 58, 74, 0.85);
      border-color: rgba(244, 206, 210, 0.55);
    }

    .hud-right {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }

    .clue-count {
      color: #f6ced4;
      font-weight: 700;
    }

    /* 하단 조작 힌트 */
    .guide-toast {
      position: fixed;
      bottom: max(18px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(31, 17, 23, 0.68);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(240, 202, 208, 0.22);
      color: rgba(251, 238, 240, 0.9);
      font-size: 12px;
      white-space: nowrap;
      pointer-events: none;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
      transition: opacity 0.35s ease;
    }

    /* 인트로 오버레이 */
    #intro-overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 35%, rgba(74, 34, 46, 0.78), rgba(20, 11, 16, 0.94));
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #intro-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .intro-card {
      width: 100%;
      max-width: 420px;
      padding: 28px 24px 26px;
      border-radius: 24px;
      background: linear-gradient(165deg, rgba(49, 25, 35, 0.92), rgba(25, 13, 19, 0.95));
      border: 1px solid rgba(236, 192, 199, 0.32);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      text-align: center;
    }

    .intro-kicker {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #eab9c2;
      margin-bottom: 8px;
    }

    .intro-title {
      font-size: 26px;
      font-weight: 700;
      color: #fff6f7;
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .intro-desc {
      font-size: 13.5px;
      line-height: 1.72;
      color: rgba(249, 232, 235, 0.88);
      margin-bottom: 22px;
    }

    .enter-btn {
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #c97b8c, #8e3e52);
      color: #fff9fa;
      font-family: 'Noto Serif KR', serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.03em;
      cursor: pointer;
      box-shadow: 0 10px 26px rgba(142, 62, 82, 0.45);
      transition: transform 0.18s ease, filter 0.18s ease;
    }

    .enter-btn:active {
      transform: scale(0.98);
      filter: brightness(1.06);
    }

    /* 오브젝트 상세 시트 */
    .scrim {
      position: fixed;
      inset: 0;
      z-index: 28;
      background: rgba(15, 8, 12, 0.42);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .scrim.open {
      opacity: 1;
      visibility: visible;
    }

    .detail-sheet {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: max(12px, env(safe-area-inset-bottom));
      z-index: 30;
      max-width: 520px;
      margin: 0 auto;
      padding: 20px 20px 22px;
      border-radius: 22px;
      background: linear-gradient(170deg, rgba(46, 23, 33, 0.96), rgba(24, 12, 18, 0.98));
      border: 1px solid rgba(240, 198, 205, 0.34);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      transform: translateY(calc(100% + 28px));
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .detail-sheet.open {
      transform: translateY(0);
    }

    .detail-tag {
      display: inline-block;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 11px;
      letter-spacing: 0.16em;
      color: #e7b5be;
      margin-bottom: 6px;
    }

    .detail-title {
      font-size: 19px;
      font-weight: 700;
      color: #fff6f7;
      margin-bottom: 10px;
    }

    .detail-quote {
      padding: 10px 14px;
      margin-bottom: 12px;
      border-left: 3px solid #d79aa6;
      background: rgba(235, 178, 188, 0.08);
      border-radius: 0 10px 10px 0;
      font-size: 13.5px;
      font-style: italic;
      line-height: 1.6;
      color: #fbe2e6;
    }

    .detail-body {
      font-size: 13.5px;
      line-height: 1.7;
      color: rgba(247, 230, 233, 0.9);
      margin-bottom: 16px;
    }

    .detail-actions {
      display: flex;
      gap: 10px;
    }

    .sheet-btn {
      flex: 1;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid rgba(240, 198, 205, 0.28);
      background: rgba(255, 255, 255, 0.07);
      color: #fff6f7;
      font-family: 'Noto Serif KR', serif;
      font-size: 13px;
      cursor: pointer;
    }

    .sheet-btn.primary {
      background: linear-gradient(135deg, #c67688, #8a3a4e);
      border-color: transparent;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="canvas-wrap"></div>

  <div class="hud-top">
    <div class="hud-pill" id="clue-pill">
      <span>🌹 장미방 단서</span>
      <span class="clue-count" id="clue-count">0</span>
      <span>/ 8</span>
    </div>

    <div class="hud-right">
      <button class="hud-pill" id="view-toggle" type="button">🏛️ 전체 조망 뷰</button>
      <button class="hud-pill active" id="audio-toggle" type="button">♪ 음악 ON</button>
    </div>
  </div>

  <div class="guide-toast" id="guide-toast">바닥·가구 탭으로 이동 · 드래그로 시선 회전</div>

  <div id="intro-overlay">
    <div class="intro-card">
      <div class="intro-kicker">THE REMARRIED EMPRESS · ROSE CHAMBER</div>
      <h1 class="intro-title">라스타의 황실 침실 · 장미방</h1>
      <p class="intro-desc">
        장미 덩굴 아치와 스테인드글라스, 로즈 플로럴 벽지와 세 개의 크리스털 샹들리에가 감싸는 장미방.<br>
        반짝이는 단서를 탭해 이야기를 모으고, 바닥과 가구를 눌러 자유롭게 걸어 보세요.
      </p>
      <button class="enter-btn" id="enter-btn" type="button">장미방 안으로 들어가기</button>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>
  <section class="detail-sheet" id="detail-sheet" aria-live="polite">
    <div class="detail-tag">ROSE CHAMBER DETAIL</div>
    <h2 class="detail-title" id="detail-title">제목</h2>
    <blockquote class="detail-quote" id="detail-quote">대사</blockquote>
    <p class="detail-body" id="detail-body">설명</p>
    <div class="detail-actions">
      <button class="sheet-btn" id="walk-here-btn" type="button">이곳으로 걸어가기</button>
      <button class="sheet-btn primary" id="close-sheet-btn" type="button">닫기</button>
    </div>
  </section>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // =========================================================
    // 1. 캔버스 & 렌더러 설정 (모바일 세로형 최적화)
    // =========================================================
    const wrap = document.getElementById('canvas-wrap');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf2dfd9);
    scene.fog = new THREE.FogExp2(0xf2dfd9, 0.014);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    wrap.appendChild(renderer.domElement);

    // 방 치수 (18m x 22m, 천장고 6.8m)
    const ROOM_W = 18;
    const ROOM_D = 22;
    const WALL_H = 6.8;
    const HALF_W = ROOM_W / 2;
    const HALF_D = ROOM_D / 2;

    // 카메라 상태
    const camera = new THREE.PerspectiveCamera(56, window.innerWidth / window.innerHeight, 0.1, 90);
    const EYE_HEIGHT = 1.62;

    const player = {
      pos: new THREE.Vector3(0, EYE_HEIGHT, 6.2),
      yaw: 0,       // 0 = -Z (침대 & 장미 아치 방향), PI = +Z (아치형 창문 살롱 방향)
      pitch: 0.02,
      targetPos: null,
      moveSpeed: 4.3,
      surface: 'rug'
    };

    let isOverview = false;
    const overviewState = {
      pos: new THREE.Vector3(0, 12.2, 13.8),
      lookAt: new THREE.Vector3(0, 1.0, -0.5),
      targetPos: new THREE.Vector3(0, 12.2, 13.8),
      targetLookAt: new THREE.Vector3(0, 1.0, -0.5)
    };

    // =========================================================
    // 2. 프로시저럴 텍스처 생성기 (장미 벽지, 파케 마루, 원형 러그, 스테인드글라스)
    // =========================================================
    function makeRoseWallpaperTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');

      // 따스한 크림 블러시 바탕
      const grad = ctx.createLinearGradient(0, 0, 512, 512);
      grad.addColorStop(0, '#f7e5e0');
      grad.addColorStop(0.5, '#f2d9d4');
      grad.addColorStop(1, '#ecd0cb');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);

      // 섬세한 로코코 트렐리스 선
      ctx.strokeStyle = 'rgba(182, 132, 138, 0.24)';
      ctx.lineWidth = 1.2;
      for (let y = 32; y < 512; y += 128) {
        for (let x = 32; x < 512; x += 128) {
          ctx.beginPath();
          ctx.moveTo(x, y - 44);
          ctx.quadraticCurveTo(x + 36, y, x, y + 44);
          ctx.quadraticCurveTo(x - 36, y, x, y - 44);
          ctx.stroke();
        }
      }

      // 장미 부케 클러스터 그리기
      function drawRose(cx, cy, r, mainCol, midCol) {
        ctx.save();
        ctx.translate(cx, cy);
        // 잎사귀
        ctx.fillStyle = '#7f9b86';
        for (let i = 0; i < 4; i++) {
          ctx.save();
          ctx.rotate((i * Math.PI) / 2 + 0.4);
          ctx.beginPath();
          ctx.ellipse(r * 0.85, 0, r * 0.55, r * 0.22, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        // 꽃잎 층
        ctx.fillStyle = mainCol;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = midCol;
        ctx.beginPath();
        ctx.arc(-r * 0.12, -r * 0.1, r * 0.65, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#b95367';
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.28, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      const centers = [
        [128, 128], [384, 128],
        [128, 384], [384, 384],
        [256, 256]
      ];
      centers.forEach(([bx, by], idx) => {
        const tone = idx % 2 === 0 ? ['#e79aa8', '#f5c6cf'] : ['#d98395', '#f0bcc6'];
        drawRose(bx, by, 17, tone[0], tone[1]);
        drawRose(bx - 22, by + 12, 11, '#e9a5b2', '#f7cfd7');
        drawRose(bx + 21, by + 10, 12, '#dc8b9c', '#f3c1ca');
        drawRose(bx, by - 22, 10, '#ecaab7', '#f8d4dc');
      });

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(2.2, 2.2);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeParquetTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');

      ctx.fillStyle = '#c59d78';
      ctx.fillRect(0, 0, 512, 512);

      const tile = 128;
      for (let gy = 0; gy < 4; gy++) {
        for (let gx = 0; gx < 4; gx++) {
          const x = gx * tile;
          const y = gy * tile;
          const shade = (gx + gy) % 2 === 0 ? '#cba47f' : '#be946e';
          ctx.fillStyle = shade;
          ctx.fillRect(x, y, tile, tile);

          // 목재 결 라인
          ctx.strokeStyle = 'rgba(110, 74, 45, 0.22)';
          ctx.lineWidth = 1;
          for (let s = 10; s < tile; s += 14) {
            ctx.beginPath();
            ctx.moveTo(x + s, y + 6);
            ctx.lineTo(x + s, y + tile - 6);
            ctx.stroke();
          }

          // 기하학 테두리 & 마름모 꽃문양
          ctx.strokeStyle = 'rgba(138, 96, 60, 0.35)';
          ctx.lineWidth = 1.6;
          ctx.strokeRect(x + 8, y + 8, tile - 16, tile - 16);

          ctx.beginPath();
          ctx.moveTo(x + tile / 2, y + 22);
          ctx.lineTo(x + tile - 22, y + tile / 2);
          ctx.lineTo(x + tile / 2, y + tile - 22);
          ctx.lineTo(x + 22, y + tile / 2);
          ctx.closePath();
          ctx.stroke();
        }
      }

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(7, 8);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeRoundRugTexture() {
      const size = 1024;
      const c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      const ctx = c.getContext('2d');
      const cx = size / 2;
      const cy = size / 2;
      const maxR = size / 2 - 12;

      // 라벤더-아이보리-로즈 톤 원형 러그 (사진 속 대형 원형 러그 모티브)
      const bgGrad = ctx.createRadialGradient(cx, cy, 40, cx, cy, maxR);
      bgGrad.addColorStop(0, '#f6e7e9');
      bgGrad.addColorStop(0.55, '#ead8e2');
      bgGrad.addColorStop(0.84, '#d3c1d4');
      bgGrad.addColorStop(0.95, '#b69fb8');
      bgGrad.addColorStop(1, '#9d85a1');

      ctx.fillStyle = bgGrad;
      ctx.beginPath();
      ctx.arc(cx, cy, maxR, 0, Math.PI * 2);
      ctx.fill();

      // 외곽 보더 링
      ctx.strokeStyle = 'rgba(136, 95, 118, 0.45)';
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.arc(cx, cy, maxR - 36, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(182, 128, 142, 0.5)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(cx, cy, maxR - 72, 0, Math.PI * 2);
      ctx.stroke();

      // 중앙 메달리온 장미
      const medGrad = ctx.createRadialGradient(cx, cy, 10, cx, cy, 150);
      medGrad.addColorStop(0, '#fff4f6');
      medGrad.addColorStop(0.7, '#f1ced6');
      medGrad.addColorStop(1, 'rgba(229, 174, 186, 0)');
      ctx.fillStyle = medGrad;
      ctx.beginPath();
      ctx.arc(cx, cy, 150, 0, Math.PI * 2);
      ctx.fill();

      // 방사형 화환 & 꽃 모티프
      const petals = 16;
      for (let i = 0; i < petals; i++) {
        const ang = (i / petals) * Math.PI * 2;
        const r1 = maxR - 115;
        const x1 = cx + Math.cos(ang) * r1;
        const y1 = cy + Math.sin(ang) * r1;

        ctx.fillStyle = i % 2 === 0 ? '#d88b9c' : '#9c8cb4';
        ctx.beginPath();
        ctx.arc(x1, y1, 20, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#f9e3e8';
        ctx.beginPath();
        ctx.arc(x1, y1, 8, 0, Math.PI * 2);
        ctx.fill();

        // 중간 링 꽃
        const r2 = maxR * 0.46;
        const x2 = cx + Math.cos(ang + 0.18) * r2;
        const y2 = cy + Math.sin(ang + 0.18) * r2;
        ctx.fillStyle = 'rgba(186, 118, 134, 0.58)';
        ctx.beginPath();
        ctx.arc(x2, y2, 13, 0, Math.PI * 2);
        ctx.fill();
      }

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeStainedGlassTexture() {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 512;
      const ctx = c.getContext('2d');

      // 따뜻한 빛이 비치는 스테인드글라스 배경
      const g = ctx.createLinearGradient(0, 0, 0, 512);
      g.addColorStop(0, '#fff2c6');
      g.addColorStop(0.5, '#fde4dc');
      g.addColorStop(1, '#dceef2');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 256, 512);

      const panels = [
        [18, 22, 102, 135, '#e8a8b5'],
        [136, 22, 102, 135, '#9ec7d4'],
        [18, 174, 220, 145, '#f4c89b'],
        [18, 336, 102, 152, '#b9d4c2'],
        [136, 336, 102, 152, '#e9b2bd']
      ];

      panels.forEach(([x, y, w, h, col]) => {
        ctx.fillStyle = col;
        ctx.fillRect(x, y, w, h);
        // 장미 원형 포인트
        ctx.fillStyle = '#d47488';
        ctx.beginPath();
        ctx.arc(x + w / 2, y + h / 2, Math.min(w, h) * 0.24, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff3f5';
        ctx.beginPath();
        ctx.arc(x + w / 2, y + h / 2, Math.min(w, h) * 0.1, 0, Math.PI * 2);
        ctx.fill();
      });

      // 납선(리드 프레임)
      ctx.strokeStyle = '#6c5850';
      ctx.lineWidth = 7;
      ctx.strokeRect(12, 16, 232, 480);
      panels.forEach(([x, y, w, h]) => {
        ctx.strokeRect(x, y, w, h);
      });

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const roseWallTex = makeRoseWallpaperTexture();
    const parquetTex = makeParquetTexture();
    const roundRugTex = makeRoundRugTexture();
    const stainedGlassTex = makeStainedGlassTexture();

    // 공용 재질 팔레트
    const mats = {
      wallpaper: new THREE.MeshStandardMaterial({ map: roseWallTex, roughness: 0.85, metalness: 0.02 }),
      sageMolding: new THREE.MeshStandardMaterial({ color: 0xa6c2b7, roughness: 0.65, metalness: 0.05 }),
      blushTrim: new THREE.MeshStandardMaterial({ color: 0xefc5cb, roughness: 0.68, metalness: 0.05 }),
      ivoryWood: new THREE.MeshStandardMaterial({ color: 0xf7efe8, roughness: 0.52, metalness: 0.06 }),
      goldLeaf: new THREE.MeshStandardMaterial({ color: 0xd9b26f, roughness: 0.34, metalness: 0.72 }),
      parquet: new THREE.MeshStandardMaterial({ map: parquetTex, roughness: 0.55, metalness: 0.05 }),
      roundRug: new THREE.MeshStandardMaterial({ map: roundRugTex, roughness: 0.92, metalness: 0.0 }),
      burgundyVelvet: new THREE.MeshStandardMaterial({ color: 0x8b3545, roughness: 0.88, metalness: 0.03 }),

      blueVelvet: new THREE.MeshStandardMaterial({ color: 0x7a9ec2, roughness: 0.84, metalness: 0.04 }),
      lavenderVelvet: new THREE.MeshStandardMaterial({ color: 0x9b86b0, roughness: 0.86, metalness: 0.04 }),
      beigeDrapery: new THREE.MeshStandardMaterial({ color: 0xd4b5a5, roughness: 0.82, metalness: 0.05 }),
      sheerCurtain: new THREE.MeshStandardMaterial({
        color: 0xfffaf7,
        roughness: 0.6,
        transparent: true,
        opacity: 0.58,
        side: THREE.DoubleSide
      }),
      foliageGreen: new THREE.MeshStandardMaterial({ color: 0x5f8564, roughness: 0.82 }),
      rosePetal: new THREE.MeshStandardMaterial({ color: 0xe68fa0, roughness: 0.68 }),
      softRosePetal: new THREE.MeshStandardMaterial({ color: 0xf6c4ce, roughness: 0.68 }),
      stainedGlass: new THREE.MeshStandardMaterial({
        map: stainedGlassTex,
        emissive: new THREE.Color(0xffe5b8),
        emissiveIntensity: 0.25,
        roughness: 0.25
      }),
      crystal: new THREE.MeshStandardMaterial({
        color: 0xfff8eb,
        emissive: new THREE.Color(0xffdfa6),
        emissiveIntensity: 0.45,
        roughness: 0.15,
        metalness: 0.2
      }),
      marble: new THREE.MeshStandardMaterial({ color: 0xf3e8e2, roughness: 0.35, metalness: 0.08 }),
      hearthDark: new THREE.MeshStandardMaterial({ color: 0x2c2225, roughness: 0.7 }),
      mirror: new THREE.MeshStandardMaterial({ color: 0xdbe9f0, roughness: 0.12, metalness: 0.85 })
    };

    // =========================================================
    // 3. 조명 구성 (따스한 로코코 샹들리에 & 스테인드글라스 채광)
    // =========================================================
    const hemiLight = new THREE.HemisphereLight(0xfff1ec, 0xc99f96, 1.15);
    hemiLight.position.set(0, WALL_H, 0);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfff0dc, 1.35);
    sunLight.position.set(6, 11, 9);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(1024, 1024);
    sunLight.shadow.camera.near = 1;
    sunLight.shadow.camera.far = 36;
    const dCam = 13;
    sunLight.shadow.camera.left = -dCam;
    sunLight.shadow.camera.right = dCam;
    sunLight.shadow.camera.top = dCam;
    sunLight.shadow.camera.bottom = -dCam;
    sunLight.shadow.bias = -0.0005;
    scene.add(sunLight);

    const bedWarmLight = new THREE.PointLight(0xffcfad, 2.2, 12);
    bedWarmLight.position.set(0, 3.8, -6.5);
    scene.add(bedWarmLight);

    const salonWarmLight = new THREE.PointLight(0xffe0be, 2.0, 12);
    salonWarmLight.position.set(0, 3.8, 6.8);
    scene.add(salonWarmLight);

    // =========================================================
    // 4. 장미방 건축 구조 (바닥, 원형 러그, 벽면, 스테인드글라스, 샹들리에)
    // =========================================================
    const roomGroup = new THREE.Group();
    scene.add(roomGroup);

    const floorHitMeshes = [];

    // 파케 원목 바닥
    const floorMesh = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W, ROOM_D), mats.parquet);
    floorMesh.rotation.x = -Math.PI / 2;
    floorMesh.receiveShadow = true;
    floorMesh.userData.surface = 'wood';
    roomGroup.add(floorMesh);
    floorHitMeshes.push(floorMesh);

    // 중앙 대형 원형 플로럴 러그
    const rugMesh = new THREE.Mesh(new THREE.CircleGeometry(6.4, 72), mats.roundRug);
    rugMesh.rotation.x = -Math.PI / 2;
    rugMesh.position.set(0, 0.014, 0.2);
    rugMesh.receiveShadow = true;
    rugMesh.userData.surface = 'carpet';
    roomGroup.add(rugMesh);
    floorHitMeshes.push(rugMesh);

    // 천장
    const ceilingMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(ROOM_W, ROOM_D),
      new THREE.MeshStandardMaterial({ color: 0xf6eae4, roughness: 0.85 })
    );
    ceilingMesh.rotation.x = Math.PI / 2;
    ceilingMesh.position.y = WALL_H;
    roomGroup.add(ceilingMesh);

    // 외벽 4면 + 세이지/블러시 몰딩 패널
    function buildWallWithPanels(width, height, pos, rotY, panelCount) {
      const wg = new THREE.Group();
      wg.position.copy(pos);
      wg.rotation.y = rotY;

      const wall = new THREE.Mesh(new THREE.PlaneGeometry(width, height), mats.wallpaper);
      wall.receiveShadow = true;
      wg.add(wall);

      // 하단 세이지 베이스보드 & 허리몰딩
      const plinth = new THREE.Mesh(new THREE.BoxGeometry(width, 0.45, 0.14), mats.sageMolding);
      plinth.position.set(0, -height / 2 + 0.225, 0.07);
      wg.add(plinth);

      const chairRail = new THREE.Mesh(new THREE.BoxGeometry(width, 0.12, 0.14), mats.blushTrim);
      chairRail.position.set(0, -height / 2 + 1.15, 0.07);
      wg.add(chairRail);

      // 상단 크라운 몰딩
      const crown = new THREE.Mesh(new THREE.BoxGeometry(width, 0.34, 0.26), mats.ivoryWood);
      crown.position.set(0, height / 2 - 0.17, 0.12);
      wg.add(crown);

      // 세로 필라스터 & 액자형 몰딩
      const span = width / panelCount;
      for (let i = 0; i <= panelCount; i++) {
        const px = -width / 2 + i * span;
        const pilaster = new THREE.Mesh(new THREE.BoxGeometry(0.28, height - 0.5, 0.14), mats.sageMolding);
        pilaster.position.set(px, 0, 0.07);
        wg.add(pilaster);
      }

      roomGroup.add(wg);
    }

    // 북벽 (z = -HALF_D): 침대 & 스테인드글라스 장미 아치 벽
    buildWallWithPanels(ROOM_W, WALL_H, new THREE.Vector3(0, WALL_H / 2, -HALF_D), 0, 4);
    // 남벽 (z = +HALF_D): 아치형 창문 & 커튼 살롱 벽
    buildWallWithPanels(ROOM_W, WALL_H, new THREE.Vector3(0, WALL_H / 2, HALF_D), Math.PI, 4);
    // 서벽 (x = -HALF_W): 화장대 & 장신구 진열 벽
    buildWallWithPanels(ROOM_D, WALL_H, new THREE.Vector3(-HALF_W, WALL_H / 2, 0), Math.PI / 2, 5);
    // 동벽 (x = +HALF_W): 대리석 벽난로 & 파스텔 블루 셰즈롱 벽
    buildWallWithPanels(ROOM_D, WALL_H, new THREE.Vector3(HALF_W, WALL_H / 2, 0), -Math.PI / 2, 5);

    // ---------------------------------------------------------
    // 북쪽 벽: 스테인드글라스 패널 & 장미 덩굴 아치 (사진 1·6 핵심 모티브)
    // ---------------------------------------------------------
    function buildStainedGlassWindow(x, y, z, rotY, w, h) {
      const sg = new THREE.Group();
      sg.position.set(x, y, z);
      sg.rotation.y = rotY;

      const glass = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mats.stainedGlass);
      glass.position.z = 0.06;
      sg.add(glass);

      // 세이지/아이보리 프레임 테두리
      const topBar = new THREE.Mesh(new THREE.BoxGeometry(w + 0.3, 0.22, 0.18), mats.sageMolding);
      topBar.position.set(0, h / 2 + 0.08, 0.09);
      const botBar = topBar.clone();
      botBar.position.set(0, -h / 2 - 0.08, 0.09);
      const leftBar = new THREE.Mesh(new THREE.BoxGeometry(0.22, h, 0.18), mats.sageMolding);
      leftBar.position.set(-w / 2 - 0.08, 0, 0.09);
      const rightBar = leftBar.clone();
      rightBar.position.set(w / 2 + 0.08, 0, 0.09);

      sg.add(topBar, botBar, leftBar, rightBar);
      roomGroup.add(sg);
    }

    // 북벽 좌우 스테인드글라스 창문들
    buildStainedGlassWindow(-6.4, 3.6, -HALF_D + 0.04, 0, 2.2, 4.4);
    buildStainedGlassWindow(6.4, 3.6, -HALF_D + 0.04, 0, 2.2, 4.4);
    // 상단 가로 스테인드글라스 트랜섬
    buildStainedGlassWindow(-3.3, 5.45, -HALF_D + 0.04, 0, 3.6, 1.1);
    buildStainedGlassWindow(3.3, 5.45, -HALF_D + 0.04, 0, 3.6, 1.1);

    // 장미 덩굴 하트/아치 화환
    const vineGroup = new THREE.Group();
    vineGroup.position.set(0, 0, -HALF_D + 0.55);
    const vinePts = [];
    for (let i = 0; i <= 36; i++) {
      const t = (i / 36) * Math.PI; // 0 -> PI
      const vx = -Math.cos(t) * 5.2;
      const vy = 1.1 + Math.sin(t) * 4.25;
      vinePts.push(new THREE.Vector3(vx, vy, 0));
    }
    const vineCurve = new THREE.CatmullRomCurve3(vinePts);
    const vineStem = new THREE.Mesh(new THREE.TubeGeometry(vineCurve, 44, 0.08, 8, false), mats.foliageGreen);
    vineGroup.add(vineStem);

    for (let i = 0; i <= 38; i++) {
      const p = vineCurve.getPoint(i / 38);
      const leaf = new THREE.Mesh(new THREE.DodecahedronGeometry(0.22, 0), mats.foliageGreen);
      leaf.scale.set(1.3, 0.45, 0.9);
      leaf.position.set(
        p.x + (Math.sin(i * 2.1) * 0.24),
        p.y + (Math.cos(i * 1.7) * 0.22),
        p.z + (Math.sin(i * 1.3) * 0.16)
      );
      leaf.rotation.set(i * 0.5, i * 0.8, i * 0.3);
      vineGroup.add(leaf);

      if (i % 3 === 1) {
        const rose = new THREE.Mesh(
          new THREE.SphereGeometry(0.14, 10, 10),
          i % 6 === 1 ? mats.rosePetal : mats.softRosePetal
        );
        rose.position.set(leaf.position.x, leaf.position.y + 0.05, leaf.position.z + 0.12);
        vineGroup.add(rose);
      }
    }
    roomGroup.add(vineGroup);

    // ---------------------------------------------------------
    // 남쪽 벽: 3개의 아치형 창문 & 로즈 베이지 드레이프 커튼 (사진 4·5 모티브)
    // ---------------------------------------------------------
    [-4.8, 0, 4.8].forEach((wx, idx) => {
      const cg = new THREE.Group();
      cg.position.set(wx, 0, HALF_D - 0.18);
      cg.rotation.y = Math.PI;

      // 창문 시어 커튼
      const sheer = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 5.2), mats.sheerCurtain);
      sheer.position.set(0, 2.75, 0.05);
      cg.add(sheer);

      // 양옆 로즈 베이지 주름 커튼
      [-1.15, 1.15].forEach((sideX) => {
        const drape = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.42, 5.2, 14, 1, true), mats.beigeDrapery);
        drape.scale.set(1.1, 1, 0.45);
        drape.position.set(sideX, 2.75, 0.16);
        drape.castShadow = true;
        cg.add(drape);
      });

      // 상단 발란스(주름 장식) & 금장 로드
      const pelmet = new THREE.Mesh(new THREE.BoxGeometry(2.95, 0.55, 0.34), mats.beigeDrapery);
      pelmet.position.set(0, 5.15, 0.18);
      const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 3.1, 12), mats.goldLeaf);
      rod.rotation.z = Math.PI / 2;
      rod.position.set(0, 5.45, 0.22);
      cg.add(pelmet, rod);

      if (idx === 1) {
        // 중앙 창가 작은 티테이블 & 암체어 세트
        const miniTable = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.42, 0.65, 20), mats.ivoryWood);
        miniTable.position.set(0, 0.325, 1.35);
        const miniTop = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.62, 0.06, 20), mats.marble);
        miniTop.position.set(0, 0.66, 1.35);
        cg.add(miniTable, miniTop);
      }

      roomGroup.add(cg);
    });

    // ---------------------------------------------------------
    // 세 개의 크리스털 샹들리에 (사진 6 천장 라인 모티브)
    // ---------------------------------------------------------
    const chandeliers = [];
    [-5.2, 0, 5.2].forEach((cx, idx) => {
      const ch = new THREE.Group();
      ch.position.set(cx, WALL_H - 1.15, idx === 1 ? -1.2 : 1.6);

      const chain = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1.15, 8), mats.goldLeaf);
      chain.position.y = 0.575;
      ch.add(chain);

      const crownRing = new THREE.Mesh(new THREE.TorusGeometry(0.75, 0.045, 10, 28), mats.goldLeaf);
      crownRing.rotation.x = Math.PI / 2;
      ch.add(crownRing);

      const lowerRing = new THREE.Mesh(new THREE.TorusGeometry(0.45, 0.035, 10, 24), mats.goldLeaf);
      lowerRing.rotation.x = Math.PI / 2;
      lowerRing.position.y = -0.35;
      ch.add(lowerRing);

      for (let k = 0; k < 14; k++) {
        const a = (k / 14) * Math.PI * 2;
        const drop = new THREE.Mesh(new THREE.OctahedronGeometry(0.085, 0), mats.crystal);
        drop.scale.set(0.8, 1.6, 0.8);
        drop.position.set(Math.cos(a) * 0.75, -0.18, Math.sin(a) * 0.75);
        ch.add(drop);
      }

      const coreGlow = new THREE.Mesh(new THREE.SphereGeometry(0.22, 14, 14), mats.crystal);
      coreGlow.position.y = -0.12;
      ch.add(coreGlow);

      roomGroup.add(ch);
      chandeliers.push(ch);
    });

    // =========================================================
    // 5. 주요 가구 & 소품 배치 (사진 1~6 장미방 구조 반영)
    // =========================================================
    const obstacles = []; // { x, z, r } 충돌 반경

    function addObstacle(x, z, r) {
      obstacles.push({ x, z, r });
    }

    // 5-1. 중앙 북쪽 캐노피 침대 & 풋벤치 (사진 1·6 중앙)
    const bedGroup = new THREE.Group();
    bedGroup.position.set(0, 0, -7.4);

    // 침대 단상
    const dais = new THREE.Mesh(new THREE.BoxGeometry(4.6, 0.18, 4.2), mats.ivoryWood);
    dais.position.y = 0.09;
    dais.receiveShadow = true;
    bedGroup.add(dais);

    // 침대 프레임 & 매트리스
    const mattress = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.42, 3.1), mats.roseVelvet);
    mattress.position.set(0, 0.52, 0.1);
    mattress.castShadow = true;
    mattress.receiveShadow = true;
    bedGroup.add(mattress);

    const duvet = new THREE.Mesh(new THREE.BoxGeometry(2.54, 0.2, 2.1), mats.burgundyVelvet);
    duvet.position.set(0, 0.76, 0.45);
    duvet.castShadow = true;
    bedGroup.add(duvet);

    // 곡선 헤드보드
    const headboard = new THREE.Mesh(new THREE.BoxGeometry(2.75, 1.55, 0.22), mats.ivoryWood);
    headboard.position.set(0, 1.15, -1.42);
    headboard.castShadow = true;
    bedGroup.add(headboard);

    // 캐노피 기둥 4개 & 버건디 백커튼 + 아이보리 시어 커튼
    const backCurtain = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 3.6), mats.burgundyVelvet);
    backCurtain.position.set(0, 2.1, -1.65);
    bedGroup.add(backCurtain);

    const canopyTop = new THREE.Mesh(new THREE.BoxGeometry(3.55, 0.35, 3.55), mats.ivoryWood);
    canopyTop.position.set(0, 3.85, 0.05);
    canopyTop.castShadow = true;
    bedGroup.add(canopyTop);

    const canopyValance = new THREE.Mesh(new THREE.BoxGeometry(3.45, 0.36, 0.2), mats.roseVelvet);
    canopyValance.position.set(0, 3.55, 1.72);
    bedGroup.add(canopyValance);

    [[-1.62, 1.62], [1.62, 1.62]].forEach(([px, pz]) => {
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.09, 3.7, 12), mats.ivoryWood);
      post.position.set(px, 1.95, pz);
      post.castShadow = true;
      bedGroup.add(post);

      const sheerDrape = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.3, 3.45, 12, 1, true), mats.sheerCurtain);
      sheerDrape.position.set(px * 0.85, 1.82, pz - 0.1);
      bedGroup.add(sheerDrape);
    });

    // 침대 앞 아이보리 풋벤치
    const footBench = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.52, 0.68), mats.ivoryWood);
    footBench.position.set(0, 0.42, 2.25);
    footBench.castShadow = true;
    bedGroup.add(footBench);

    const benchSeat = new THREE.Mesh(new THREE.BoxGeometry(1.96, 0.14, 0.58), mats.beigeDrapery);
    benchSeat.position.set(0, 0.72, 2.25);
    bedGroup.add(benchSeat);

    roomGroup.add(bedGroup);
    addObstacle(0, -7.4, 2.4);

    // 5-2. 서쪽 화장대 & 장신구 진열대 (사진 2 모티브)
    const vanityGroup = new THREE.Group();
    vanityGroup.position.set(-7.3, 0, -2.4);
    vanityGroup.rotation.y = Math.PI / 2;

    const vanityDesk = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.82, 0.85), mats.ivoryWood);
    vanityDesk.position.set(0, 0.41, 0);
    vanityDesk.castShadow = true;
    vanityDesk.receiveShadow = true;
    vanityGroup.add(vanityDesk);

    const vanityTrim = new THREE.Mesh(new THREE.BoxGeometry(2.36, 0.06, 0.9), mats.goldLeaf);
    vanityTrim.position.set(0, 0.84, 0);
    vanityGroup.add(vanityTrim);

    // 3단 거울 프레임
    const mirrorMain = new THREE.Mesh(new THREE.BoxGeometry(1.05, 1.15, 0.08), mats.goldLeaf);
    mirrorMain.position.set(0, 1.42, -0.22);
    const mirrorGlass = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.98), mats.mirror);
    mirrorGlass.position.set(0, 1.42, -0.17);
    vanityGroup.add(mirrorMain, mirrorGlass);

    [-0.68, 0.68].forEach((mx, idx) => {
      const sideMir = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.95, 0.07), mats.goldLeaf);
      sideMir.position.set(mx, 1.32, -0.16);
      sideMir.rotation.y = idx === 0 ? 0.35 : -0.35;
      vanityGroup.add(sideMir);
    });

    // 화장대 스툴
    const stool = new THREE.Mesh(new THREE.BoxGeometry(0.68, 0.48, 0.52), mats.blueVelvet);
    stool.position.set(0, 0.24, 0.68);
    vanityGroup.add(stool);

    // 옆쪽 모자·보석함 테이블
    const sideDisplay = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.52, 0.76, 20), mats.ivoryWood);
    sideDisplay.position.set(1.85, 0.38, 0.05);
    const hatBox = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.26, 18), mats.burgundyVelvet);
    hatBox.position.set(1.85, 0.89, 0.05);
    vanityGroup.add(sideDisplay, hatBox);

    roomGroup.add(vanityGroup);
    addObstacle(-7.3, -2.4, 1.5);

    // 5-3. 동쪽 파스텔 블루 셰즈롱 & 대리석 벽난로 (사진 1·3·6 우측 모티브)
    const chaiseGroup = new THREE.Group();
    chaiseGroup.position.set(6.8, 0, -2.8);
    chaiseGroup.rotation.y = -Math.PI / 2.2;

    const chaiseBody = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.44, 1.85), mats.blueVelvet);
    chaiseBody.position.set(0, 0.28, 0);
    chaiseBody.castShadow = true;
    chaiseGroup.add(chaiseBody);

    const chaiseBack = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.72, 0.22), mats.ivoryWood);
    chaiseBack.position.set(0, 0.66, -0.82);
    chaiseGroup.add(chaiseBack);

    const chaiseThrow = new THREE.Mesh(new THREE.BoxGeometry(0.88, 0.08, 0.95), mats.sheerCurtain);
    chaiseThrow.position.set(0, 0.52, 0.32);
    chaiseGroup.add(chaiseThrow);

    roomGroup.add(chaiseGroup);
    addObstacle(6.8, -2.8, 1.25);

    // 대리석 벽난로
    const fireplaceGroup = new THREE.Group();

    const discovered = new Set();

    const markerMatDefault = new THREE.MeshStandardMaterial({

    // =========================================================
    // 7. Web Audio (오르골·하프 아르페지오 배경음 + 바닥 재질별 발소리)
    // =========================================================
    const audioCtxHolder = { ctx: null, enabled: true, timerId: null, step: 0 };

    function ensureAudio() {
      if (!audioCtxHolder.ctx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtxHolder.ctx = new Ctx();
      }
      if (audioCtxHolder.ctx && audioCtxHolder.ctx.state === 'suspended') {
        audioCtxHolder.ctx.resume().catch(() => {});
      }
      return audioCtxHolder.ctx;
    }

    // 장미방 감성의 부드러운 오르골·하프 아르페지오 패턴 (Fmaj7 - Em7 - Dm7 - Cmaj7 느낌)
    const ARP_NOTES = [
      523.25, 659.25, 783.99, 987.77, // C5 E5 G5 B5
      493.88, 659.25, 783.99, 987.77, // B4 E5 G5 B5
      440.00, 659.25, 783.99, 880.00, // A4 E5 G5 A5
      392.00, 587.33, 783.99, 987.77  // G4 D5 G5 B5
    ];

    function playArpNote(freq) {
      if (!audioCtxHolder.enabled) return;
      const ctx = ensureAudio();
      if (!ctx) return;

      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.032, now + 0.025);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.35);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 1.4);
    }

    function startMusicLoop() {
      if (audioCtxHolder.timerId) return;
      audioCtxHolder.timerId = setInterval(() => {
        if (!audioCtxHolder.enabled) return;
        const note = ARP_NOTES[audioCtxHolder.step % ARP_NOTES.length];
        playArpNote(note);
        audioCtxHolder.step += 1;
      }, 420);
    }

    function playFootstep(surface) {
      if (!audioCtxHolder.enabled) return;
      const ctx = ensureAudio();
      if (!ctx) return;

      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      if (surface === 'carpet') {
        // 폭신한 러그·카펫 발소리
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(115, now);
        osc.frequency.exponentialRampToValueAtTime(52, now + 0.09);
        gain.gain.setValueAtTime(0.045, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      } else {
        // 원목 마루 발소리
        osc.type = 'sine';
        osc.frequency.setValueAtTime(195, now);
        osc.frequency.exponentialRampToValueAtTime(75, now + 0.075);
        gain.gain.setValueAtTime(0.055, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.085);
      }

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.11);
    }

    // =========================================================
    // 8. UI & 상호작용 (탭 이동, 드래그 시선 회전, 시점 전환, 단서 시트)
    // =========================================================
    const clueCountEl = document.getElementById('clue-count');
    const viewToggleBtn = document.getElementById('view-toggle');
    const audioToggleBtn = document.getElementById('audio-toggle');
    const guideToast = document.getElementById('guide-toast');
    const introOverlay = document.getElementById('intro-overlay');
    const enterBtn = document.getElementById('enter-btn');

    const detailBody = document.getElementById('detail-body');

    let activeClue = null;

    function openClueSheet(clue, index) {
      activeClue = clue;
      detailTitle.textContent = clue.title;
      detailQuote.textContent = clue.quote;
      detailBody.textContent = clue.body;

      if (!discovered.has(index)) {
        discovered.add(index);
        clueCountEl.textContent = String(discovered.size);
        const m = clueMarkers[index];
        if (m) m.gem.material = markerMatFound;
      }

      scrim.classList.add('open');
      detailSheet.classList.add('open');
    }

    function closeClueSheet() {
      scrim.classList.remove('open');

    closeSheetBtn.addEventListener('click', closeClueSheet);

    walkHereBtn.addEventListener('click', () => {
      if (!activeClue) return;

      }

    });

    function toggleViewMode(forceOverview) {
      isOverview = typeof forceOverview === 'boolean' ? forceOverview : !isOverview;
      if (isOverview) {
        viewToggleBtn.textContent = '👁️ 눈높이 시점';
        viewToggleBtn.classList.add('active');
        guideToast.textContent = '전체 조망 뷰 · 단서나 바닥을 탭해 이동해 보세요';
      } else {

    });

    // 레이캐스팅 (단서 선택 & 바닥 탭 이동)
    const raycaster = new THREE.Raycaster();
    const pointerNdc = new THREE.Vector2();

    function clampToRoom(v) {
      const margin = 1.1;
      v.x = Math.max(-HALF_W + margin, Math.min(HALF_W - margin, v.x));
      v.z = Math.max(-HALF_D + margin, Math.min(HALF_D - margin, v.z));
      for (const ob of obstacles) {
        const dx = v.x - ob.x;
        const dz = v.z - ob.z;
        const dist = Math.hypot(dx, dz);
        const minDist = ob.r + 0.55;
        if (dist < minDist && dist > 0.0001) {
          v.x = ob.x + (dx / dist) * minDist;
          v.z = ob.z + (dz / dist) * minDist;
        }
      }
      v.y = EYE_HEIGHT;
      return v;
    }

    let pointerDownPos = { x: 0, y: 0 };
    let isDragging = false;
    let lastDragPos = { x: 0, y: 0 };

    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (detailSheet.classList.contains('open')) return;
      ensureAudio();
      pointerDownPos = { x: e.clientX, y: e.clientY };
      lastDragPos = { x: e.clientX, y: e.clientY };
      isDragging = true;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging || detailSheet.classList.contains('open')) return;
      const dx = e.clientX - lastDragPos.x;
      const dy = e.clientY - lastDragPos.y;
      lastDragPos = { x: e.clientX, y: e.clientY };

      if (!isOverview) {
        player.yaw -= dx * 0.0052;
        player.pitch = Math.max(-0.52, Math.min(0.52, player.pitch - dy * 0.0042));
      } else {
        overviewState.targetPos.x = Math.max(-7.5, Math.min(7.5, overviewState.targetPos.x - dx * 0.015));
        overviewState.targetPos.z = Math.max(3.0, Math.min(16.5, overviewState.targetPos.z - dy * 0.015));
      }
    });

    window.addEventListener('pointerup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      if (detailSheet.classList.contains('open')) return;

      const movedDist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      if (movedDist > 9) return; // 드래그였으면 탭 이동 무시

      const rect = renderer.domElement.getBoundingClientRect();
      pointerNdc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointerNdc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(pointerNdc, camera);

      // 1) 단서 다이아몬드 클릭 판정
      const gemTargets = clueMarkers.map((m) => m.gem);
      const gemHits = raycaster.intersectObjects(gemTargets, false);
      if (gemHits.length > 0) {
        const idx = gemHits[0].object.userData.clueIndex;
        if (typeof idx === 'number' && CLUES[idx]) {
          openClueSheet(CLUES[idx], idx);
          return;
        }
      }

      // 2) 바닥 탭 이동 판정
      const floorHits = raycaster.intersectObjects(floorHitMeshes, false);
      if (floorHits.length > 0) {
        const pt = floorHits[0].point.clone();
        const dest = clampToRoom(pt);
        if (isOverview) {
          player.pos.copy(dest);
          player.targetPos = null;
          toggleViewMode(false);
        } else {
          player.targetPos = dest;
        }
      }
    });

    // =========================================================
    // 9. 애니메이션 루프
    // =========================================================
    const clock = new THREE.Clock();
    let stepAccum = 0;

    function updatePlayerMovement(dt) {
      if (player.targetPos) {
        const toTarget = new THREE.Vector3().subVectors(player.targetPos, player.pos);
        toTarget.y = 0;
        const dist = toTarget.length();
        if (dist < 0.12) {
          player.targetPos = null;
        } else {
          toTarget.normalize();
          const stepLen = Math.min(dist, player.moveSpeed * dt);
          player.pos.addScaledVector(toTarget, stepLen);
          clampToRoom(player.pos);

          // 부드럽게 이동 방향으로 시선 회전
          const desiredYaw = Math.atan2(-toTarget.x, -toTarget.z);
          let diff = desiredYaw - player.yaw;
          while (diff > Math.PI) diff -= Math.PI * 2;
          while (diff < -Math.PI) diff += Math.PI * 2;
          player.yaw += diff * Math.min(1, dt * 7);

          // 바닥 재질 판별 및 발소리 재생
          const onRug = Math.hypot(player.pos.x, player.pos.z - 0.2) <= 6.4;
          player.surface = onRug ? 'carpet' : 'wood';
          stepAccum += stepLen;
          if (stepAccum >= 1.15) {
            stepAccum = 0;
            playFootstep(player.surface);
          }
        }
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.getElapsedTime();

      updatePlayerMovement(dt);

      // 단서 마커 부유 & 회전 연출
      clueMarkers.forEach((m) => {
        m.gem.rotation.y = elapsed * 1.6 + m.index;
        m.gem.position.y = Math.sin(elapsed * 2.4 + m.index) * 0.08;
        m.ring.position.y = -0.32 + Math.sin(elapsed * 2.4 + m.index) * 0.06;
      });

      // 샹들리에 미세 흔들림
      chandeliers.forEach((ch, i) => {
        ch.rotation.z = Math.sin(elapsed * 0.9 + i) * 0.015;
      });

      if (isOverview) {
        overviewState.pos.lerp(overviewState.targetPos, Math.min(1, dt * 6));
        overviewState.lookAt.lerp(overviewState.targetLookAt, Math.min(1, dt * 6));
        camera.position.copy(overviewState.pos);
        camera.lookAt(overviewState.lookAt);
      } else {
        const bob = player.targetPos ? Math.sin(elapsed * 12) * 0.035 : Math.sin(elapsed * 1.8) * 0.008;
        camera.position.set(player.pos.x, player.pos.y + bob, player.pos.z);

        const euler = new THREE.Euler(player.pitch, player.yaw, 0, 'YXZ');
        camera.quaternion.setFromEuler(euler);
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
